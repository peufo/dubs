# Développement local : uniquement MongoDB (lancé par `pnpm run dev`).
# La prod est décrite dans compose.prod.yml.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - 127.0.0.1:27018:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - data:/data/db

volumes:
  data:
